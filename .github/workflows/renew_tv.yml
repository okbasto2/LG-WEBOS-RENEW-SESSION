name: Silent webOS Dev Mode Renewal

on:
  schedule:
    # Runs automatically every single day at 12:12 AM UTC
    - cron: '12 0 * * *'
  workflow_dispatch: # Allows you to also trigger it manually anytime with a button click

jobs:
  renew-token:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LG Developer Server Quietly
        run: |
          curl -s -X GET "https://developer.lge.com/secure/ResetDevModeSession.dev?sessionToken={{ secrets.LG_SESSION_TOKEN }}"
          echo "Token renewal signal sent successfully to LG API."
