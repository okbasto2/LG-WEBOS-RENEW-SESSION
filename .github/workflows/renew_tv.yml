name: LG TV SSH & IP Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  report-ip:
    runs-on: ubuntu-latest

    steps:
      - name: SSH to LG TV and Send Telegram Notification
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          HOST: ${{ secrets.ROUTER_HOST }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh

          # 1. Decode key cleanly and ensure trailing newline + strict permissions
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/collo_TV_webos
          echo "" >> ~/.ssh/collo_TV_webos
          chmod 600 ~/.ssh/collo_TV_webos

          # 2. Write SSH Config
          cat << EOF > ~/.ssh/config
          Host lgtv
              HostName ${HOST}
              User prisoner
              Port 9922
              IdentityFile ~/.ssh/collo_TV_webos
              RequestTTY no
              HostKeyAlgorithms +ssh-rsa
              StrictHostKeyChecking no
              PubkeyAcceptedKeyTypes +ssh-rsa
          EOF

          # 3. Handle Passphrase via askpass helper
          eval $(ssh-agent -s)
          
          cat << 'EOF' > ~/.ssh/askpass.sh
          #!/bin/sh
          echo "$PASSPHRASE"
          EOF
          chmod +x ~/.ssh/askpass.sh

          DISPLAY=None SSH_ASKPASS=~/.ssh/askpass.sh ssh-add ~/.ssh/collo_TV_webos < /dev/null

          # 4. Fetch Public IP from TV
          TV_PUBLIC_IP=$(ssh lgtv "curl -s https://api.ipify.org")

          # 5. Send Telegram notification
          MSG="📺 *LG TV Daily Status*
          • *Public IP:* \`${TV_PUBLIC_IP}\`
          • *Host:* \`${HOST}\`"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" > /dev/null
