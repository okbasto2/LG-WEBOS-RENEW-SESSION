name: LG TV SSH & IP Report

on:
  workflow_dispatch:

jobs:
  report-ip:
    runs-on: ubuntu-latest

    steps:
      - name: SSH to LG TV and Send Telegram Notification
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          HOST: ${{ secrets.HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          mkdir -p ~/.ssh

          echo "==> Decoding SSH Key..."
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/collo_TV_webos
          echo "" >> ~/.ssh/collo_TV_webos
          chmod 600 ~/.ssh/collo_TV_webos

          echo "==> Configuring SSH..."
          cat << EOF > ~/.ssh/config
          Host lgtv
              HostName ${HOST}
              User prisoner
              Port 9922
              IdentityFile ~/.ssh/collo_TV_webos
              RequestTTY no
              HostKeyAlgorithms +ssh-rsa
              StrictHostKeyChecking no
              PubkeyAcceptedKeyTypes +ssh-rsa
              ConnectTimeout 15
          EOF

          echo "==> Setting up ssh-agent and passphrase..."
          eval $(ssh-agent -s)

          cat << 'EOF' > ~/.ssh/askpass.sh
          #!/bin/sh
          echo "$PASSPHRASE"
          EOF
          chmod +x ~/.ssh/askpass.sh

          DISPLAY=None SSH_ASKPASS=~/.ssh/askpass.sh ssh-add ~/.ssh/collo_TV_webos < /dev/null

          echo "==> Testing SSH connection to ${HOST}:9922..."
          # -v prints full connection handshake to pinpoint errors
          TV_PUBLIC_IP=$(ssh -v lgtv "curl -s https://api.ipify.org")

          echo "==> TV Public IP retrieved: $TV_PUBLIC_IP"

          echo "==> Sending Telegram notification..."
          MSG="📺 *LG TV Daily Status*
          • *Public IP:* \`${TV_PUBLIC_IP}\`
          • *Host:* \`${HOST}\`"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" > /dev/null

          echo "==> Done!"
